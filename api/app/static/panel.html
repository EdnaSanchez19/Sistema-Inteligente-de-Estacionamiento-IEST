<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estacionamiento IEST · Panel</title>
<style>
  :root {
    --marron: #6a2f23; --marron-2: #4d2119; --naranja: #f28c28; --fondo: #f5f1ee; --tarjeta: #ffffff; --texto: #241a17; --suave: #7b6b65; --borde: #e7dfda;
    --libre: #2e9e5b; --ocupado: #d64545; --reservado: #e0a800; --fuera: #8a93a0; --ok: #2e9e5b; --mal: #d64545; --sombra: 0 1px 2px rgba(60,30,20,.06), 0 4px 14px rgba(60,30,20,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #171110; --tarjeta: #241a18; --texto: #f4ece8; --suave: #b6a7a1; --borde: #382b27; --sombra: 0 1px 2px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); }
  h1, h2, h3 { margin: 0; }
  * { scrollbar-width: thin; scrollbar-color: var(--borde) transparent; }

  /* ---------- barra superior ---------- */
  header { background: linear-gradient(135deg, var(--marron-2), var(--marron)); color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .marca { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 50%; background: var(--naranja); display: grid; place-items: center; font-weight: 800; font-size: 22px; }
  .marca h1 { font-size: 17px; font-weight: 700; line-height: 1.1; }
  .marca small { opacity: .75; font-size: 12px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; justify-content: center; }
  .chip { display: inline-flex; align-items: center; gap: 7px; background: #ffffff1a; border: 1px solid #ffffff26; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; white-space: nowrap; }
  .punto { width: 9px; height: 9px; border-radius: 50%; background: var(--fuera); flex: none; }
  .punto.ok { background: #46d17f; box-shadow: 0 0 0 0 #46d17f99; animation: latido 2s infinite; }
  .punto.mal { background: #ff6b6b; }
  @keyframes latido { 70% { box-shadow: 0 0 0 7px #46d17f00; } 100% { box-shadow: 0 0 0 0 #46d17f00; } }
  .usuario { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .usuario button { background: transparent; color: #fff; border: 1px solid #ffffff55; border-radius: 8px; padding: 5px 11px; cursor: pointer; }
  .usuario button:hover { background: #ffffff1f; }

  main { max-width: 1320px; margin: 0 auto; padding: 18px 18px 56px; display: grid; gap: 16px; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 16px; padding: 18px; box-shadow: var(--sombra); }
  .tarjeta > h2, .titulo { font-size: 14px; font-weight: 700; letter-spacing: .02em; color: var(--suave); text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  /* ---------- flujo del sistema ---------- */
  .flujo { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding-bottom: 4px; }
  .nodo { flex: 1 1 0; min-width: 150px; border: 1px solid var(--borde); border-radius: 14px; padding: 12px; background: var(--fondo); position: relative; }
  .nodo .icono { font-size: 22px; line-height: 1; }
  .nodo .nombre { font-weight: 700; font-size: 14px; margin-top: 6px; display: flex; align-items: center; gap: 7px; }
  .nodo .nombre .punto { width: 8px; height: 8px; }
  .nodo .dato { font-size: 12px; color: var(--suave); margin-top: 3px; min-height: 16px; }
  .nodo.activo { border-color: #2e9e5b66; }
  .enlace { flex: 0 0 38px; position: relative; align-self: center; height: 2px; background: var(--borde); margin: 0 2px; }
  .enlace.activo { background: #2e9e5b55; }
  .enlace.activo::after { content: ""; position: absolute; top: -3px; left: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--libre); animation: viaja 1.4s linear infinite; }
  @keyframes viaja { from { left: 0; opacity: 1; } to { left: calc(100% - 8px); opacity: .3; } }

  /* ---------- cuadrícula principal ---------- */
  .principal { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(300px, 1fr); gap: 16px; }
  @media (max-width: 980px) { .principal { grid-template-columns: 1fr; } }
  .video { position: relative; background: #0d0908; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; }
  .video img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .video .fuera { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; color: #d8c9c3; gap: 8px; font-size: 14px; }
  .video .fuera code { background: #ffffff14; padding: 6px 10px; border-radius: 8px; font-size: 12px; user-select: all; }
  .pestanas { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .pestanas button { border: 1px solid var(--borde); background: var(--fondo); color: var(--texto); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; }
  .pestanas button.sel { background: var(--marron); border-color: var(--marron); color: #fff; }
  .pie-video { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 13px; color: var(--suave); }
  .pie-video b { color: var(--texto); }
  .leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--suave); }
  .leyenda span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--c); }

  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .kpi .valor { font-size: 38px; font-weight: 800; line-height: 1; }
  .kpi .rotulo { font-size: 12.5px; color: var(--suave); margin-top: 5px; }
  .donut { display: grid; place-items: center; margin: 4px 0 14px; position: relative; }
  .donut svg { width: 150px; height: 150px; transform: rotate(-90deg); }
  .donut .centro { position: absolute; text-align: center; }
  .donut .centro b { font-size: 28px; display: block; }
  .donut .centro span { font-size: 11.5px; color: var(--suave); }
  .modelo dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
  .modelo dt { color: var(--suave); } .modelo dd { margin: 0; font-weight: 600; text-align: right; }
  .modelo canvas { width: 100%; height: 54px; margin-top: 12px; display: block; }

  /* ---------- mapa ---------- */
  .zonas { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .zona-cab { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .zona-cab h3 { font-size: 17px; }
  .zona-cab span { font-size: 13px; color: var(--suave); }
  .barra { height: 8px; border-radius: 5px; background: var(--borde); overflow: hidden; display: flex; margin: 8px 0 14px; }
  .barra i { display: block; height: 100%; transition: width .6s; }
  .cajones { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 6px; }
  .cajon { height: 50px; border-radius: 9px; color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; position: relative; transition: background .4s, transform .2s; cursor: default; }
  .cajon:hover { transform: scale(1.06); }
  .cajon small { position: absolute; top: 2px; right: 5px; font-size: 10px; opacity: .9; }
  .libre { background: var(--libre); } .ocupado { background: var(--ocupado); } .reservado { background: var(--reservado); } .fuera_de_servicio { background: var(--fuera); }
  .cajon.cambio { animation: destello 2.4s ease-out; }
  @keyframes destello { 0% { box-shadow: 0 0 0 0 var(--naranja); transform: scale(1.18); } 60% { box-shadow: 0 0 0 9px #f28c2800; } 100% { transform: scale(1); } }

  /* ---------- listas ---------- */
  .trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 330px; overflow-y: auto; }
  li { font-size: 13px; padding: 9px 11px; border-radius: 10px; background: var(--fondo); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  li time { color: var(--suave); white-space: nowrap; font-size: 12px; }
  li.nuevo { animation: entra 1s ease-out; }
  @keyframes entra { from { background: #f28c2833; transform: translateX(-6px); } }
  .insignia { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .vacio { color: var(--suave); font-size: 13px; padding: 8px 2px; }

  /* ---------- login ---------- */
  .login { max-width: 380px; margin: 9vh auto; display: grid; gap: 12px; text-align: center; padding: 28px; }
  .login .logo { margin: 0 auto 4px; width: 56px; height: 56px; font-size: 30px; color: #fff; }
  .login input { padding: 12px; border-radius: 10px; border: 1px solid var(--borde); background: var(--fondo); color: var(--texto); font-size: 15px; }
  .login button { padding: 12px; border: 0; border-radius: 10px; background: var(--naranja); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  .error { color: var(--mal); font-size: 13px; min-height: 18px; }
  .pie { color: var(--suave); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="marca"><div class="logo">P</div><div><h1>Estacionamiento IEST</h1><small>Sistema inteligente · IEST Anáhuac</small></div></div>
  <div class="chips" id="chips"></div>
  <div class="usuario"><span id="quien"></span><button id="salir" hidden>Cerrar sesión</button></div>
</header>
<main id="app"></main>

<script>
const API = location.origin;
const VISION = (new URLSearchParams(location.search).get("vision") || `${location.protocol}//${location.hostname}:8100`).replace(/\/$/, "");
let token = sessionStorage.getItem("token");
let timerRapido = null, timerLento = null;
let camaraSel = "CAM-01";
let estadoPrevio = new Map();       // numero -> estado (para destacar cambios)
let eventosVistos = new Set();
let latencias = [];                 // historial para la gráfica
let primeraVez = true;

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const hora = (iso) => iso ? new Date(iso).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "sin señal";
const $ = (id) => document.getElementById(id);

async function api(path) {
  const r = await fetch(API + path, { headers: { Authorization: "Bearer " + token } });
  if (r.status === 401) { cerrarSesion(); throw new Error("Sesión expirada"); }
  if (r.status === 403) return null;
  if (!r.ok) throw new Error("Error " + r.status);
  return r.json();
}

/* ------------------------------ login ------------------------------ */
function vistaLogin(mensaje) {
  clearInterval(timerRapido); clearInterval(timerLento);
  $("quien").textContent = ""; $("salir").hidden = true; $("chips").replaceChildren();
  const app = $("app"); app.replaceChildren();
  const f = el("form", "tarjeta login");
  f.append(el("div", "logo", "P"), el("h2", null, "Iniciar sesión"));
  f.firstChild.style.background = "var(--marron)";
  f.children[1].style.cssText = "text-transform:none;font-size:20px;color:var(--texto);justify-content:center;margin:0 0 4px";
  const correo = el("input"); correo.type = "email"; correo.placeholder = "Correo institucional"; correo.required = true; correo.autocomplete = "username";
  const pass = el("input"); pass.type = "password"; pass.placeholder = "Contraseña"; pass.required = true; pass.autocomplete = "current-password";
  const err = el("div", "error", mensaje || "");
  const btn = el("button", null, "Entrar"); btn.type = "submit";
  f.append(correo, pass, err, btn);
  f.addEventListener("submit", async (ev) => {
    ev.preventDefault(); btn.disabled = true; err.textContent = "";
    try {
      const r = await fetch(API + "/auth/login", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams({ username: correo.value.trim(), password: pass.value }) });
      if (!r.ok) throw new Error(r.status === 401 ? "Correo o contraseña incorrectos" : "Error " + r.status);
      token = (await r.json()).access_token; sessionStorage.setItem("token", token); iniciar();
    } catch (e) { err.textContent = e.message; btn.disabled = false; }
  });
  app.append(f); correo.focus();
}
function cerrarSesion() { token = null; sessionStorage.removeItem("token"); vistaLogin(); }
$("salir").addEventListener("click", cerrarSesion);

/* ------------------------------ estructura ------------------------------ */
function armarEstructura() {
  const app = $("app"); app.replaceChildren();
  const html = `
  <section class="tarjeta"><h2>Flujo del sistema <span id="flujo-hora" style="text-transform:none;font-weight:400"></span></h2>
    <div class="flujo" id="flujo"></div></section>

  <div class="principal">
    <section class="tarjeta"><h2>Cámara en vivo · detección con YOLO <span class="leyenda"><span style="--c:var(--ocupado)">Ocupado</span><span style="--c:var(--libre)">Libre</span><span style="--c:#ffd700">Vehículo detectado</span></span></h2>
      <div class="pestanas" id="pestanas"></div>
      <div class="video"><img id="video" alt="Video de la cámara con las detecciones del modelo"><div class="fuera" id="video-fuera" hidden></div></div>
      <div class="pie-video" id="pie-video"></div>
    </section>
    <div style="display:grid;gap:16px;align-content:start">
      <section class="tarjeta"><h2>Disponibilidad</h2>
        <div class="donut"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--borde)" stroke-width="14"/><circle id="arco" cx="60" cy="60" r="50" fill="none" stroke="var(--ocupado)" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 314" style="transition: stroke-dasharray .8s"/></svg>
          <div class="centro"><b id="pct">–</b><span>ocupación</span></div></div>
        <div class="kpis"><div class="kpi"><div class="valor" id="k-libres" style="color:var(--libre)">–</div><div class="rotulo">Libres</div></div><div class="kpi"><div class="valor" id="k-ocupados" style="color:var(--ocupado)">–</div><div class="rotulo">Ocupados</div></div></div>
        <div class="leyenda"><span style="--c:var(--libre)">Libre</span><span style="--c:var(--ocupado)">Ocupado</span><span style="--c:var(--reservado)">Reservado</span><span style="--c:var(--fuera)">Fuera de servicio</span></div>
      </section>
      <section class="tarjeta modelo"><h2>Modelo de visión</h2><dl id="modelo"></dl><canvas id="spark" width="400" height="54"></canvas><div class="rotulo" style="font-size:11.5px;color:var(--suave);margin-top:4px">Latencia por detección (últimos ~2 min)</div></section>
    </div>
  </div>

  <section><div class="zonas" id="zonas"></div></section>
  <div class="trio" id="trio"></div>
  <div class="pie" id="pie"></div>`;
  app.insertAdjacentHTML("beforeend", html);
}

/* ------------------------------ flujo ------------------------------ */
function pintarFlujo(s, camaras) {
  const vis = s.vision.find((v) => v.camara === camaraSel) || s.vision[0];
  const visOk = s.vision_conectada;
  const nodos = [
    ["📹", "Cámara", visOk && vis ? "ok" : "mal", vis ? `${vis.camara} · ${vis.resolucion} · ${vis.fps_video} fps` : "sin señal", visOk],
    ["🧠", "Visión · YOLO", visOk ? "ok" : "mal", vis ? `${vis.modelo} · ${vis.latencia_ms.toFixed(0)} ms · ${vis.vehiculos} vehículos` : "servidor sin conexión", visOk],
    ["⚙️", "API", "ok", `FastAPI v${s.version} · ${s.eventos_ultimo_minuto} eventos/min`, true],
    ["🗄️", "Base de datos", s.base_de_datos.estado === "ok" ? "ok" : "mal", `${s.base_de_datos.motor} · ${Object.values(s.espacios).reduce((a, b) => a + b, 0)} cajones`, true],
    ["📱", "Panel y app móvil", "ok", `Cámaras en línea: ${s.camaras.en_linea}/${s.camaras.total}`, true],
  ];
  const cont = $("flujo"); cont.replaceChildren();
  nodos.forEach(([icono, nombre, est, dato, activo], i) => {
    const n = el("div", "nodo" + (activo ? " activo" : ""));
    n.append(el("div", "icono", icono));
    const nom = el("div", "nombre"); const p = el("span", "punto " + est); nom.append(p, document.createTextNode(nombre)); n.append(nom, el("div", "dato", dato));
    cont.append(n);
    if (i < nodos.length - 1) cont.append(el("div", "enlace" + (nodos[i + 1][4] && activo ? " activo" : "")));
  });
  $("flujo-hora").textContent = "actualizado " + hora(s.hora);
}

/* ------------------------------ chips de estado ------------------------------ */
function pintarChips(s) {
  const chips = $("chips"); chips.replaceChildren();
  const datos = [
    ["API", true, "v" + s.version],
    ["Base de datos", s.base_de_datos.estado === "ok", s.base_de_datos.motor],
    ["Modelo YOLO", s.vision_conectada, s.vision_conectada ? s.vision[0].modelo + " · " + s.vision[0].dispositivo : "sin conexión"],
    ["Cámaras", s.camaras.en_linea > 0, `${s.camaras.en_linea}/${s.camaras.total} en línea`],
  ];
  for (const [nombre, ok, det] of datos) { const c = el("span", "chip"); c.append(el("span", "punto " + (ok ? "ok" : "mal")), document.createTextNode(nombre + " · " + det)); chips.append(c); }
}

/* ------------------------------ video y modelo ------------------------------ */
let videoActual = null;
function pintarVideo(s) {
  const nombres = s.vision.length ? s.vision.map((v) => v.camara) : ["CAM-01"];
  if (!nombres.includes(camaraSel)) camaraSel = nombres[0];
  const pest = $("pestanas");
  if (pest.dataset.lista !== nombres.join()) {
    pest.dataset.lista = nombres.join(); pest.replaceChildren();
    for (const n of nombres) { const b = el("button", n === camaraSel ? "sel" : "", n); b.onclick = () => { camaraSel = n; videoActual = null; pintarVideo(s); }; pest.append(b); }
  } else { [...pest.children].forEach((b) => b.classList.toggle("sel", b.textContent === camaraSel)); }

  const img = $("video"), fuera = $("video-fuera");
  if (videoActual !== camaraSel) {
    videoActual = camaraSel; fuera.hidden = true;
    img.onload = () => { fuera.hidden = true; };
    img.onerror = () => {
      fuera.hidden = false; fuera.replaceChildren(el("b", null, "Sin señal del servidor de visión"), el("span", null, "Inícialo para ver el video con las detecciones:"), el("code", null, "python -m parking_vision.demo_server"));
      setTimeout(() => { if (videoActual === camaraSel) img.src = `${VISION}/stream/${camaraSel}?t=${Date.now()}`; }, 4000);
    };
    img.src = `${VISION}/stream/${camaraSel}?t=${Date.now()}`;
  }

  const v = s.vision.find((x) => x.camara === camaraSel);
  const pie = $("pie-video"); pie.replaceChildren();
  if (v) for (const [k, val] of [["Vehículos detectados", v.vehiculos], ["Cajones vigilados", `${v.ocupados} ocupados · ${v.libres} libres`], ["Resolución", v.resolucion], ["Último reporte", `hace ${v.hace_s.toFixed(0)} s`]]) { const sp = el("span"); sp.append(document.createTextNode(k + ": "), el("b", null, String(val))); pie.append(sp); }

  const dl = $("modelo"); dl.replaceChildren();
  if (v) {
    latencias = [...latencias, v.latencia_ms].slice(-60);
    for (const [k, val] of [["Modelo", v.modelo], ["Dispositivo", v.dispositivo.startsWith("cuda") ? "GPU (" + v.dispositivo + ")" : v.dispositivo], ["Entrada", v.imgsz + " px"], ["Confianza mínima", Math.round(v.umbral_confianza * 100) + " %"], ["Latencia", v.latencia_ms.toFixed(0) + " ms"], ["Detecciones/s", v.fps_deteccion.toFixed(1)], ["Video", v.fps_video + " fps"]]) { dl.append(el("dt", null, k), el("dd", null, val)); }
    dibujarSpark();
  } else { dl.append(el("dt", null, "Estado"), el("dd", null, "sin conexión")); }
}

function dibujarSpark() {
  const c = $("spark"), g = c.getContext("2d"); g.clearRect(0, 0, c.width, c.height);
  if (latencias.length < 2) return;
  const max = Math.max(...latencias) * 1.15 || 1, w = c.width, h = c.height;
  g.lineWidth = 2; g.strokeStyle = "#f28c28"; g.beginPath();
  latencias.forEach((v, i) => { const x = (i / (latencias.length - 1)) * w, y = h - (v / max) * (h - 6) - 3; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke(); g.lineTo(w, h); g.lineTo(0, h); g.closePath(); g.fillStyle = "#f28c2822"; g.fill();
}

/* ------------------------------ disponibilidad y mapa ------------------------------ */
const TIPO = { discapacidad: "♿", directivo: "★", visitante: "V", motocicleta: "M" };
function pintarEspacios(espacios) {
  const util = espacios.filter((e) => e.estado !== "fuera_de_servicio");
  const libres = util.filter((e) => e.estado === "libre").length, ocupados = util.filter((e) => e.estado === "ocupado").length;
  $("k-libres").textContent = libres; $("k-ocupados").textContent = ocupados;
  const pct = util.length ? Math.round((ocupados / util.length) * 100) : 0; $("pct").textContent = pct + " %";
  $("arco").setAttribute("stroke-dasharray", `${(pct / 100) * 314} 314`);

  const zonas = $("zonas"); zonas.replaceChildren();
  for (const z of [...new Set(espacios.map((e) => e.zona))].sort()) {
    const lista = espacios.filter((e) => e.zona === z), lib = lista.filter((e) => e.estado === "libre").length, oc = lista.filter((e) => e.estado === "ocupado").length;
    const t = el("div", "tarjeta"); const cab = el("div", "zona-cab"); cab.append(el("h3", null, "Zona " + z), el("span", null, `${lib} libres de ${lista.length}`)); t.append(cab);
    const barra = el("div", "barra"); const b1 = el("i"); b1.style.cssText = `width:${(oc / lista.length) * 100}%;background:var(--ocupado)`; const b2 = el("i"); b2.style.cssText = `width:${(lib / lista.length) * 100}%;background:var(--libre)`; barra.append(b1, b2); t.append(barra);
    const g = el("div", "cajones");
    for (const e of lista) {
      const cambio = !primeraVez && estadoPrevio.has(e.numero) && estadoPrevio.get(e.numero) !== e.estado;
      const c = el("div", "cajon " + e.estado + (cambio ? " cambio" : ""), e.numero.split("-")[1]); c.title = `${e.numero} · ${e.estado.replace(/_/g, " ")} · ${e.tipo}`;
      if (TIPO[e.tipo]) c.append(el("small", null, TIPO[e.tipo])); g.append(c);
    }
    t.append(g); zonas.append(t);
  }
  estadoPrevio = new Map(espacios.map((e) => [e.numero, e.estado])); primeraVez = false;
}

/* ------------------------------ eventos, cámaras, avisos ------------------------------ */
const COLOR = { entrada: "#2e9e5b", salida: "#6a2f23", cambio_ocupacion: "#c99700", error_deteccion: "#d64545", camara_desconectada: "#d64545", camara_restablecida: "#2e9e5b" };
function pintarListas(avisos, eventos, camaras) {
  const trio = $("trio"); trio.replaceChildren();
  const tarjeta = (titulo, hijos, vacio) => { const t = el("div", "tarjeta"); t.append(el("h2", null, titulo)); if (!hijos.length) t.append(el("div", "vacio", vacio)); else { const ul = el("ul"); ul.append(...hijos); t.append(ul); } trio.append(t); };
  if (eventos) {
    const lis = eventos.map((e) => { const li = el("li", eventosVistos.size && !eventosVistos.has(e.id) ? "nuevo" : ""); const iz = el("span"); const ins = el("span", "insignia", e.tipo.replace(/_/g, " ")); ins.style.background = COLOR[e.tipo] || "#888"; iz.append(ins, document.createTextNode(" " + e.descripcion)); li.append(iz, el("time", null, hora(e.fecha))); return li; });
    eventos.forEach((e) => eventosVistos.add(e.id));
    tarjeta("Eventos en tiempo real", lis, "Aún no hay eventos.");
  }
  if (camaras) {
    tarjeta("Cámaras", camaras.map((c) => { const li = el("li"); const ins = el("span", "insignia", c.estado === "en_linea" ? "en línea" : "desconectada"); ins.style.background = c.estado === "en_linea" ? "#2e9e5b" : "#d64545"; const iz = el("span", null, `${c.camara} · zona ${c.zona} `); iz.append(ins); li.append(iz, el("time", null, hora(c.ultimaSenal))); return li; }), "Sin cámaras.");
  }
  tarjeta("Avisos", avisos.slice(0, 8).map((a) => { const li = el("li"); li.append(el("span", null, a.titulo + " — " + a.mensaje), el("time", null, hora(a.fecha))); return li; }), "No hay avisos.");
}

/* ------------------------------ ciclos de actualización ------------------------------ */
async function cicloRapido() {   // cada 2 s: estado del sistema y mapa
  const [yo, estado, espacios] = await Promise.all([api("/auth/me"), api("/sistema/estado"), api("/espacios")]);
  $("quien").textContent = yo.nombre; $("salir").hidden = false;
  pintarChips(estado); pintarFlujo(estado); pintarVideo(estado); pintarEspacios(espacios);
  $("pie").textContent = "Actualizado " + new Date().toLocaleTimeString("es-MX") + " · el mapa se refresca cada 2 s";
}
async function cicloLento() {    // cada 4 s: listas
  const [avisos, eventos, camaras] = await Promise.all([api("/notificaciones"), api("/eventos?limit=14"), api("/camaras")]);
  pintarListas(avisos, eventos, camaras);
}

function iniciar() {
  armarEstructura(); primeraVez = true; eventosVistos = new Set(); videoActual = null;
  const aviso = (e) => { if (token) $("pie").textContent = "⚠ " + e.message; };
  cicloRapido().catch(aviso); cicloLento().catch(aviso);
  clearInterval(timerRapido); clearInterval(timerLento);
  timerRapido = setInterval(() => cicloRapido().catch(aviso), 2000);
  timerLento = setInterval(() => cicloLento().catch(() => {}), 4000);
}

token ? iniciar() : vistaLogin();
</script>
