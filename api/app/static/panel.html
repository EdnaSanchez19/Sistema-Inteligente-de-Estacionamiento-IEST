<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estacionamiento IEST Anáhuac</title>
<script>try { const t = localStorage.getItem("tema"); if (t === "claro" || t === "oscuro") document.documentElement.dataset.tema = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --marino: #132539; --naranja: #f86923; --naranja-fuerte: #ff5900; --naranja-suave: #fff1e8; --fondo: #f7f7f7; --tarjeta: #ffffff; --texto: #222222; --suave: #666666; --borde: #e4e4e4; --hover: #f1f1f1;
    --titular: "Zilla Slab", Georgia, serif; --marca-fuente: Montserrat, "Segoe UI", system-ui, sans-serif;
    --libre: #2e9e5b; --ocupado: #d64545; --obstruido: #f2c200; --reservado: #4f7fd9; --fuera: #8a93a0; --sin: #b9aea8; --ok: #2e9e5b; --mal: #d64545;
    --sombra: 0 1px 2px rgba(19,37,57,.06), 0 6px 18px rgba(19,37,57,.05);
  }
  /* oscuro: lo pide el sistema operativo, salvo que el botón del panel haya fijado un tema */
  @media (prefers-color-scheme: dark) {
    :root:not([data-tema="claro"]) { --fondo: #0e1a29; --tarjeta: #132539; --texto: #f2f4f7; --suave: #a9b6c6; --borde: #263c55; --hover: #1b3350; --sin: #4d6177; --naranja-suave: #3a2a22; --sombra: 0 1px 2px rgba(0,0,0,.45); }
  }
  :root[data-tema="oscuro"] { --fondo: #0e1a29; --tarjeta: #132539; --texto: #f2f4f7; --suave: #a9b6c6; --borde: #263c55; --hover: #1b3350; --sin: #4d6177; --naranja-suave: #3a2a22; --sombra: 0 1px 2px rgba(0,0,0,.45); }
  :root[data-tema="claro"] { color-scheme: light; } :root[data-tema="oscuro"] { color-scheme: dark; }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--borde) transparent; }
  html, body { height: 100%; }
  body { margin: 0; font-family: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); font-size: 14px; }
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: 4px; background: var(--naranja); z-index: 80; }  /* la línea naranja del sitio */
  h1, h2, h3, h4, p { margin: 0; }
  button { font: inherit; color: inherit; }

  /* ---------- estructura ---------- */
  #app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
  #app.login { display: block; }
  aside { background: var(--tarjeta); color: var(--texto); border-right: 1px solid var(--borde); display: flex; flex-direction: column; padding: 22px 12px 18px; position: sticky; top: 0; height: 100vh; }
  .marca { display: flex; align-items: center; gap: 11px; padding: 0 8px 18px; }
  .logo { width: 38px; height: 38px; border-radius: 6px; background: var(--naranja); color: #fff; display: grid; place-items: center; font-family: var(--marca-fuente); font-weight: 800; font-size: 21px; flex: none; }
  .marca b { display: block; font-family: var(--marca-fuente); font-size: 15px; font-weight: 800; letter-spacing: .02em; line-height: 1.15; text-transform: uppercase; } .marca small { color: var(--suave); font-size: 11.5px; }
  nav { display: grid; gap: 3px; }
  nav button { display: flex; align-items: center; gap: 11px; background: transparent; border: 0; color: var(--texto); padding: 11px 12px; border-radius: 5px; cursor: pointer; text-align: left; font-family: var(--marca-fuente); font-size: 12.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  nav button:hover { background: var(--hover); }
  nav button.sel { background: var(--naranja-suave); color: var(--naranja-fuerte); font-weight: 700; box-shadow: inset 3px 0 0 var(--naranja); }
  nav svg { width: 19px; height: 19px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav .cuenta { margin-left: auto; font-size: 11px; background: var(--hover); color: var(--suave); padding: 1px 8px; border-radius: 99px; }
  .lado-pie { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--borde); font-size: 12.5px; display: grid; gap: 8px; }
  .lado-pie button { background: transparent; border: 1px solid var(--borde); color: var(--texto); padding: 8px; border-radius: 5px; cursor: pointer; font-family: var(--marca-fuente); font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .lado-pie button:hover { border-color: var(--naranja); color: var(--naranja-fuerte); }
  .conexion { display: flex; align-items: center; gap: 7px; color: var(--suave); }

  main { padding: 20px 26px 60px; min-width: 0; }
  .cabecera { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .cabecera h2 { font-family: var(--titular); font-size: 30px; font-weight: 600; line-height: 1.1; }
  .cabecera .sub { color: var(--suave); font-size: 13.5px; margin-top: 4px; }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 7px; background: var(--tarjeta); border: 1px solid var(--borde); padding: 5px 11px; border-radius: 999px; font-size: 12.5px; white-space: nowrap; }
  .punto { width: 9px; height: 9px; border-radius: 50%; background: var(--fuera); flex: none; }
  .punto.ok { background: var(--ok); } .punto.mal { background: var(--mal); } .punto.aviso { background: var(--obstruido); }
  .punto.ok.vivo { animation: latido 2s infinite; }
  @keyframes latido { 0% { box-shadow: 0 0 0 0 #2e9e5b88; } 70% { box-shadow: 0 0 0 7px #2e9e5b00; } 100% { box-shadow: 0 0 0 0 #2e9e5b00; } }

  .vista { display: none; gap: 16px; } .vista.activa { display: grid; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 18px; box-shadow: var(--sombra); min-width: 0; }
  .tarjeta > h3, .titulo { font-family: var(--marca-fuente); font-size: 12px; font-weight: 700; letter-spacing: .07em; color: var(--suave); text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .titulo .nota, h3 .nota { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .vacio { color: var(--suave); padding: 10px 2px; }
  .rejilla { display: grid; gap: 16px; }
  .dos { grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); }
  .dos-iguales { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  @media (max-width: 1100px) { .dos { grid-template-columns: 1fr; } }

  /* ---------- KPIs ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpi { background: var(--tarjeta); border: 1px solid var(--borde); border-top: 3px solid var(--naranja); border-radius: 10px; padding: 14px 17px; box-shadow: var(--sombra); }
  .kpi .rot { font-family: var(--marca-fuente); font-size: 11.5px; color: var(--suave); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .kpi .val { font-family: var(--marca-fuente); font-size: 34px; font-weight: 800; line-height: 1.1; margin-top: 6px; }
  .kpi .val small { font-size: 15px; font-weight: 500; color: var(--suave); }
  .kpi .sub { font-size: 12px; color: var(--suave); margin-top: 3px; }
  .barra { height: 7px; border-radius: 5px; background: var(--borde); overflow: hidden; display: flex; margin-top: 9px; }
  .barra i { display: block; height: 100%; transition: width .6s; }

  /* ---------- video ---------- */
  .video { position: relative; background: #0b1420; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; }
  .video img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .video .fuera { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 22px; color: #d8c9c3; gap: 8px; font-size: 13.5px; }
  .video .fuera code { background: #ffffff14; padding: 6px 10px; border-radius: 8px; font-size: 12px; user-select: all; }
  .pestanas { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .pestanas button { border: 1px solid var(--borde); background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; }
  .pestanas button:hover { background: var(--hover); }
  .pestanas button.sel { background: var(--naranja); border-color: var(--naranja); color: #fff; }
  .datos { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 13px; color: var(--suave); }
  .datos b { color: var(--texto); }

  /* ---------- islas ---------- */
  .leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--suave); align-items: center; }
  .leyenda span::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
  .leyenda .sin::before { background: repeating-linear-gradient(45deg, var(--sin) 0 2px, transparent 2px 4px); border: 1px solid var(--sin); }
  .islas { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .isla-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .isla-cab h4 { font-size: 17px; } .isla-cab span { font-size: 12.5px; color: var(--suave); }
  .cobertura { display: inline-block; font-size: 11.5px; padding: 2px 9px; border-radius: 99px; background: var(--hover); color: var(--suave); margin-top: 6px; }
  .cobertura.total { background: #2e9e5b22; color: var(--libre); } .cobertura.nula { background: transparent; border: 1px dashed var(--sin); }
  .cajones { display: grid; grid-template-columns: repeat(auto-fill, minmax(33px, 1fr)); gap: 5px; margin-top: 12px; }
  .cajon { height: 33px; border-radius: 7px; color: #fff; font-weight: 700; font-size: 11.5px; display: grid; place-items: center; position: relative; cursor: pointer; border: 0; padding: 0; transition: transform .15s, background .4s; }
  .cajon:hover { transform: scale(1.12); z-index: 2; }
  .cajon small { position: absolute; top: 0; right: 3px; font-size: 8px; }
  .libre { background: var(--libre); } .ocupado { background: var(--ocupado); } .obstruido { background: var(--obstruido); color: #3b2f00; } .reservado { background: var(--reservado); } .fuera_de_servicio { background: var(--fuera); }
  .cajon.sin { background: repeating-linear-gradient(45deg, var(--sin) 0 2px, transparent 2px 5px); color: var(--suave); border: 1px solid var(--sin); font-weight: 500; }
  .cajon.cambio { animation: destello 2.4s ease-out; }
  @keyframes destello { 0% { box-shadow: 0 0 0 0 var(--naranja); transform: scale(1.2); } 60% { box-shadow: 0 0 0 9px #f8692300; } 100% { transform: scale(1); } }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filtros button { border: 1px solid var(--borde); background: var(--tarjeta); padding: 6px 13px; border-radius: 999px; cursor: pointer; font-size: 13px; }
  .filtros button.sel { background: var(--naranja); border-color: var(--naranja); color: #fff; }
  .filtros input[type=search], .campo input, .campo select { border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto); padding: 8px 11px; border-radius: 10px; font: inherit; min-width: 0; }

  /* ---------- listas y tablas ---------- */
  ul.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; max-height: 420px; overflow-y: auto; }
  ul.lista li { padding: 9px 11px; border-radius: 10px; background: var(--fondo); display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 13px; }
  ul.lista time { color: var(--suave); white-space: nowrap; font-size: 12px; }
  ul.lista li.nuevo { animation: entra 1.2s ease-out; }
  @keyframes entra { from { background: #f8692338; transform: translateX(-6px); } }
  .insignia { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; color: #fff; white-space: nowrap; display: inline-block; }
  .tabla-caja { overflow: auto; max-height: 560px; border: 1px solid var(--borde); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); padding: 10px 12px; position: sticky; top: 0; background: var(--tarjeta); border-bottom: 1px solid var(--borde); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--borde); vertical-align: top; }
  tr:last-child td { border-bottom: 0; } tbody tr:hover { background: var(--hover); }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }

  /* ---------- flujo y cámaras ---------- */
  .flujo { display: flex; align-items: stretch; overflow-x: auto; padding-bottom: 4px; }
  .nodo { flex: 1 1 0; min-width: 150px; border: 1px solid var(--borde); border-radius: 14px; padding: 12px; background: var(--fondo); }
  .nodo .nom { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 7px; margin-top: 4px; }
  .nodo .dato { font-size: 12px; color: var(--suave); margin-top: 4px; line-height: 1.4; }
  .nodo .ico { font-size: 21px; line-height: 1; }
  .enlace { flex: 0 0 34px; position: relative; align-self: center; height: 2px; background: var(--borde); margin: 0 2px; }
  .enlace.activo { background: #2e9e5b55; }
  .enlace.activo::after { content: ""; position: absolute; top: -3px; left: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--libre); animation: viaja 1.4s linear infinite; }
  @keyframes viaja { from { left: 0; opacity: 1; } to { left: calc(100% - 8px); opacity: .3; } }
  .camaras { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
  .camara-tarj { padding: 14px; } .camara-tarj .video { cursor: zoom-in; }
  .camara-cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  .camara-cab b { font-size: 15px; }
  .sinvideo { aspect-ratio: 16/9; border: 1px dashed var(--sin); border-radius: 12px; display: grid; place-content: center; text-align: center; color: var(--suave); padding: 16px; gap: 4px; }

  /* ---------- formularios ---------- */
  .formularios { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  form.campos { display: grid; gap: 10px; }
  .campo { display: grid; gap: 4px; font-size: 12.5px; color: var(--suave); }
  .campo input, .campo select { color: var(--texto); font-size: 14px; }
  .boton { background: var(--naranja); color: #fff; border: 0; padding: 11px 18px; border-radius: 5px; font-family: var(--marca-fuente); font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  .boton:hover:not(:disabled) { background: var(--naranja-fuerte); }
  .boton:disabled { opacity: .5; cursor: default; }

  /* ---------- modal, toasts, login ---------- */
  #modal { position: fixed; inset: 0; background: #0009; display: none; place-items: center; z-index: 50; padding: 20px; }
  #modal.abierto { display: grid; }
  .modal-caja { background: var(--tarjeta); border-radius: 18px; max-width: min(920px, 100%); width: 100%; max-height: 90vh; overflow: auto; padding: 22px; position: relative; box-shadow: 0 20px 60px #0008; }
  .modal-cerrar { position: absolute; top: 12px; right: 14px; background: transparent; border: 0; font-size: 24px; cursor: pointer; color: var(--suave); line-height: 1; }
  .detalle { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 12px 0 16px; font-size: 14px; }
  .detalle dt { color: var(--suave); } .detalle dd { margin: 0; font-weight: 600; }
  #toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 60; }
  .toast { background: var(--marino); color: #fff; border-left: 4px solid var(--naranja); padding: 11px 15px; border-radius: 6px; box-shadow: 0 8px 24px #0006; max-width: 360px; font-size: 13px; animation: entra 0.4s ease-out; }
  .toast.mal { background: #a63030; } .toast.ok { background: #2a7d4c; }
  /* inicio de sesión: la foto del campus a la izquierda, el formulario a la derecha */
  #app.login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(380px, 1fr); gap: 0; width: auto; padding: 0; border: 0; text-align: left; background: var(--fondo); }
  #app.login .portada .logo { margin: 0; }
  .portada { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 56px 52px; color: #fff; min-height: 100vh; overflow: hidden;
    background: #132539 url("/panel/portada.jpg") 47% 40% / cover no-repeat; }
  .portada::before { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(19,37,57,.94) 0%, rgba(19,37,57,.55) 38%, rgba(19,37,57,.05) 70%), linear-gradient(120deg, rgba(248,105,35,.28), rgba(248,105,35,0) 55%); }
  .portada > * { position: relative; }
  .portada .insignia { display: flex; align-items: center; gap: 12px; position: absolute; top: 34px; left: 52px; }
  .portada .insignia .logo { width: 44px; height: 44px; font-size: 24px; }
  .portada .insignia b { font-family: var(--marca-fuente); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 16px; text-shadow: 0 1px 8px #0008; }
  .portada small { font-family: var(--marca-fuente); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: #ffb48c; }
  .portada h1 { font-family: var(--titular); font-weight: 600; font-size: 46px; line-height: 1.08; max-width: 560px; text-shadow: 0 2px 16px #0006; }
  .portada p { font-size: 15.5px; line-height: 1.5; max-width: 480px; opacity: .92; }
  .acceso { position: relative; display: grid; place-items: center; padding: 40px 28px; }
  .acceso .tema { position: absolute; top: 20px; right: 22px; background: transparent; border: 1px solid var(--borde); color: var(--suave); padding: 7px 12px; border-radius: 5px; cursor: pointer; font-family: var(--marca-fuente); font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .acceso .tema:hover { border-color: var(--naranja); color: var(--naranja-fuerte); }
  .acceso .pie { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: var(--suave); font-size: 12px; }
  .login { width: min(390px, 100%); display: grid; gap: 12px; text-align: center; padding: 32px 30px; border-top: 4px solid var(--naranja); }
  @media (max-width: 860px) {
    #app.login { grid-template-columns: 1fr; }
    .portada { min-height: 260px; padding: 24px 22px; justify-content: flex-end; }
    .portada .insignia { top: 18px; left: 22px; }
    .portada h1 { font-size: 28px; } .portada p { display: none; }
    .acceso { padding: 66px 16px 60px; }
  }
  .login h2 { font-family: var(--titular); font-size: 26px; font-weight: 600; }
  .login .logo { margin: 0 auto 4px; width: 54px; height: 54px; font-size: 28px; }
  .login input { padding: 12px; border-radius: 5px; border: 1px solid var(--borde); background: var(--fondo); color: var(--texto); font-size: 15px; }
  .error { color: var(--mal); font-size: 13px; min-height: 18px; }
  canvas.grafica { width: 100%; height: 190px; display: block; }

  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px; }
    .marca { padding: 0; } nav { display: flex; flex-wrap: wrap; } nav button { padding: 8px 10px; }
    .lado-pie { margin: 0 0 0 auto; border: 0; padding: 0; display: flex; align-items: center; }
    main { padding: 16px 12px 50px; }
  }
</style>
</head>
<body>
<div id="app" class="login"></div>
<div id="modal"><div class="modal-caja"><button class="modal-cerrar" aria-label="Cerrar">×</button><div id="modal-contenido"></div></div></div>
<div id="toasts"></div>

<script>
"use strict";
/* ============================== utilidades ============================== */
const API = location.origin;
const VISION = (new URLSearchParams(location.search).get("vision") || `${location.protocol}//${location.hostname}:8100`).replace(/\/$/, "");
const $ = (id) => document.getElementById(id);
const h = (tag, props, ...hijos) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of hijos.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
};

  g.beginPath(); valores.forEach((v, i) => { const x = (i / (valores.length - 1)) * w, y = hh - (v / max) * (hh - 6) - 3; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.strokeStyle = "#f86923"; g.lineWidth = 2; g.stroke(); g.lineTo(w, hh); g.lineTo(0, hh); g.closePath(); g.fillStyle = "#f8692326"; g.fill();
}

/* ============================== modal ============================== */
function abrirModal(contenido) { $("modal-contenido").replaceChildren(contenido); $("modal").classList.add("abierto"); }
function cerrarModal() { $("modal").classList.remove("abierto"); $("modal-contenido").replaceChildren(); }
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal" || e.target.classList.contains("modal-cerrar")) cerrarModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarModal(); });

/* ============================== ciclo de actualización ============================== */
function pintarComun() {
  const s = S.estado, v = s.vision;
  const chip = (nombre, ok, det) => h("span", { class: "chip" }, h("span", { class: "punto " + (ok ? "ok" : "mal") }), `${nombre} · ${det}`);
  $("chips").replaceChildren(chip("API", true, "v" + s.version), chip("Base de datos", s.base_de_datos.estado === "ok", s.base_de_datos.motor), chip("Modelo YOLO", s.vision_conectada, s.vision_conectada ? `${v[0].modelo} · ${v[0].dispositivo}` : "sin conexión"), chip("Cámaras", s.camaras.en_linea > 0, `${s.camaras.en_linea}/${s.camaras.total} en línea`));
  const n = $("cuenta-eventos"); if (n) { const nuevos = S.eventos ? S.eventos.filter((e) => !S.vistos.has(e.id)).length : 0; n.hidden = !(nuevos && S.vista !== "eventos"); n.textContent = nuevos; }
}
function pintar() {
  if (!S.estado) return;
  pintarComun();
  ({ resumen: pintarResumen, camaras: pintarCamaras, islas: pintarIslas, eventos: pintarEventos, sistema: pintarSistema, admin: () => {} })[S.vista]();
}
function conexion(ok) {
  const p = $("punto-conexion"); if (!p) return; p.className = "punto " + (ok ? "ok vivo" : "mal"); $("texto-conexion").textContent = ok ? "Conectado" : "Sin conexión con la API";
}
async function cicloRapido() {
  const [estado, espacios, estancias] = await Promise.all([api("/sistema/estado"), api("/espacios"), api("/sistema/estancias?limite=8")]);
  S.estado = estado; S.espacios = espacios; S.estancias = estancias || [];
  for (const x of estado.vision) { const a = (S.latCam[x.camara] = S.latCam[x.camara] || []); a.push(x.latencia_ms); if (a.length > 60) a.shift(); }
  pintar();
  S.previo = new Map(espacios.map((e) => [e.numero, e.estado + e.monitoreado])); S.primera = false; conexion(true);
}
async function cicloLento() {
  const [avisos, eventos, camaras] = await Promise.all([api("/notificaciones"), api("/eventos?limit=200"), api("/camaras")]);
  S.avisos = avisos; S.camaras = camaras;
  if (eventos && S.vistos.size) {  // avisa de lo importante que acaba de pasar
    for (const e of eventos.filter((x) => !S.vistos.has(x.id))) { if (e.tipo === "camara_desconectada" || e.tipo === "error_deteccion") toast(e.descripcion, "mal"); else if (e.tipo === "camara_restablecida") toast(e.descripcion, "ok"); }
  }
  S.eventos = eventos;
  if (eventos && !S.vistos.size) eventos.forEach((e) => S.vistos.add(e.id));  // lo que ya estaba al abrir no cuenta como nuevo
  pintar(); if (eventos && S.vista === "eventos") eventos.forEach((e) => S.vistos.add(e.id));
}
async function cicloSerie() { S.serie = await api("/sistema/historial?minutos=60"); if (S.vista === "resumen") pintarResumen(); }

async function iniciar() {
  try { S.yo = await api("/auth/me"); } catch (e) { return vistaLogin(e.message); }
  Object.assign(S, { primera: true, vistos: new Set(), eventos: null });
  armarEstructura();
  const inicial = (location.hash || "#resumen").slice(1); S.vista = VISTAS.some(([v]) => v === inicial) ? inicial : "resumen";
  const aviso = () => conexion(false);
  await Promise.all([cicloRapido().catch(aviso), cicloLento().catch(aviso), cicloSerie().catch(() => {})]);
  ir(S.vista);
  timers.forEach(clearInterval);
  timers = [setInterval(() => cicloRapido().catch(aviso), 2000), setInterval(() => cicloLento().catch(() => {}), 4000), setInterval(() => cicloSerie().catch(() => {}), 10000)];
  window.addEventListener("resize", () => { if (S.vista === "resumen") dibujarSerie($("grafica"), S.serie); });
}
window.addEventListener("hashchange", () => { const v = (location.hash || "").slice(1); if (S.yo && v !== S.vista && VISTAS.some(([x]) => x === v)) ir(v); });

token ? iniciar() : vistaLogin();
</script>
